<script>
  // Reemplazo de window.storage (propio del entorno de Artifacts de Claude)
  // usando localStorage del navegador.
  window.storage = {
    async get(key) {
      const v = localStorage.getItem(key);
      return v === null ? null : { key, value: v, shared: false };
    },
    async set(key, value) {
      localStorage.setItem(key, value);
      return { key, value, shared: false };
    },
    async delete(key) {
      localStorage.removeItem(key);
      return { key, deleted: true, shared: false };
    },
    async list(prefix) {
      const keys = Object.keys(localStorage).filter((k) => !prefix || k.startsWith(prefix));
      return { keys, prefix, shared: false };
    },
  };
</script>

  if (!fechaProximoContacto) return false;
  const hoy = new Date();

}

      const ahora = Date.now();
      const papeleraLimpia = papeleraCargada.filter((c) => !c.borradoEl || (ahora - c.borradoEl) < 1000 * 60 * 60 * 24 * 30);

  // Ejecuta la búsqueda para una zona y fusiona los resultados con lo que ya había,
  // usando un updater funcional para no pisar resultados de otras zonas en la autobúsqueda.
  async function ejecutarBusquedaZona(zona) {
    try {
      const res = await fetch(`/.netlify/functions/buscar-sugerencias?zona=${encodeURIComponent(zona)}`);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Error buscando sugerencias');
      let nuevasCount = 0;
      setSugerenciasIA((actuales) => {
        const existentesIds = new Set(actuales.map((s) => s.id));
        const nuevas = (data.sugerencias || []).filter((s) => !existentesIds.has(s.id));
        nuevasCount = nuevas.length;
        const combinadas = [...nuevas, ...actuales];
        window.storage.set(SUGERENCIAS_IA_KEY, JSON.stringify(combinadas), false).catch(() => {});
        return combinadas;
      });
      return { ok: true, nuevasCount };
    } catch (e) {
      console.error('Error en ejecutarBusquedaZona', e);
      return { ok: false };
    }
  }

  async function buscarSugerencias() {
    const zona = zonaBusqueda.trim();
    if (!zona) return;
    setBuscandoSugerencias(true);
    setErrorBusqueda(null);
    const resultado = await ejecutarBusquedaZona(zona);
    if (!resultado.ok) {
      setErrorBusqueda('No se pudo completar la búsqueda. Inténtalo de nuevo en unos segundos.');
    } else if (resultado.nuevasCount === 0) {
      setErrorBusqueda('No se han encontrado negocios nuevos sin web en esa zona. Prueba con otra.');
    }
    setBuscandoSugerencias(false);
  }

    if (f['Plan']) partesNotas.push(`Plan: ${f['Plan']}`);
    if (f['Estilo']) partesNotas.push(`Estilo: ${f['Estilo']}`);
    if (f['Referencia']) partesNotas.push(`Referencia: ${f['Referencia']}`);
    if (f['Mensaje']) partesNotas.push(f['Mensaje']);
    const entrada = {
      id: Date.now().toString(),
      negocio,
      tipo: f['Tipo de negocio'] || '',
      contacto,
      notas: partesNotas.join(' · '),
      precio: '',
      plazo: '',
      prioridad: '',
      origen: 'Solicitud web',
      etiquetas: '',
      mantenimiento: false,
      precioMantenimiento: '',
      link: '',
      estadoPago: 'sin_pagar',
      estado: 'por_contactar',
      fecha: new Date().toLocaleDateString('es-ES'),
      fechaOrden: Date.now(),
      proximoContacto: '',
      archivado: false,
    };
    guardar([entrada, ...clientes]);
    guardarAgregadas([...solicitudesAgregadas, registro.id]);
  }

  function cambiarEstado(id, estado) {
    guardar(clientes.map((c) => (c.id === id ? { ...c, estado } : c)));
  }

  async function guardarPapelera(lista) {
    setPapelera(lista);
    try {
      await window.storage.set(PAPELERA_KEY, JSON.stringify(lista), false);
    } catch (e) {}
  }

  // Eliminar ya no borra para siempre: manda el negocio a la Papelera.
  function eliminar(id) {
    const cliente = clientes.find((c) => c.id === id);
    if (!cliente) return;
    guardar(clientes.filter((c) => c.id !== id));
    guardarPapelera([{ ...cliente, borradoEl: Date.now() }, ...papelera]);
  }

  function restaurarDePapelera(id) {
    const cliente = papelera.find((c) => c.id === id);
    if (!cliente) return;
    const { borradoEl, ...limpio } = cliente;
    guardarPapelera(papelera.filter((c) => c.id !== id));
    guardar([limpio, ...clientes]);
  }

  function eliminarDefinitivo(id) {
    guardarPapelera(papelera.filter((c) => c.id !== id));
  }

  function vaciarPapelera() {
    guardarPapelera([]);
  }

  // Archivar mueve el negocio a "Ya hechos": ya tiene su web y no necesita más seguimiento.
  function archivar(id) {
    guardar(clientes.map((c) => (c.id === id ? { ...c, archivado: true, estado: 'cerrado' } : c)));
  }

  function desarchivar(id) {
    guardar(clientes.map((c) => (c.id === id ? { ...c, archivado: false } : c)));
  }

  function actualizarCampo(id, campo, valor) {
    setClientes((prev) => prev.map((c) => (c.id === id ? { ...c, [campo]: valor } : c)));
  }

  function guardarCampo(id, campo, valor) {
    guardar(clientes.map((c) => (c.id === id ? { ...c, [campo]: valor } : c)));
  }

  function exportarCSV() {
    const filas = [['Negocio', 'Tipo', 'Contacto', 'Estado', 'Precio', 'Estado de pago', 'Mantenimiento mensual', 'Prioridad', 'Origen', 'Etiquetas', 'Link web', 'Plazo entrega', 'Ya hecho', 'Próximo contacto', 'Notas', 'Añadido']];
    clientes.forEach((c) => {
      filas.push([
        c.negocio, c.tipo, c.contacto, estadoInfo(c.estado).label, c.precio || '',
        pagoInfo(c.estadoPago).label, c.mantenimiento ? (c.precioMantenimiento || '0') + ' €/mes' : '',
        c.prioridad ? (prioridadInfo(c.prioridad) || {}).label || '' : '', c.origen || '', c.etiquetas || '',
        c.link || '', c.plazo || '', c.archivado ? 'Sí' : 'No', c.proximoContacto || '', c.notas, c.fecha,
      ]);
    });
    const csv = filas.map((f) => f.map((v) => `"${(v || '').toString().replace(/"/g, '""')}"`).join(',')).join('\n');
    const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'clientes-atrio.csv';
    a.click();
    URL.revokeObjectURL(url);
  }

  const visibles = useMemo(() => {
    let lista = clientes.filter((c) => {
      if (c.archivado) return false;
      const pasaFiltro = filtro === 'todos' || c.estado === filtro;
      const pasaBusqueda = c.negocio.toLowerCase().includes(busqueda.toLowerCase());
      return pasaFiltro && pasaBusqueda;
    });
    if (orden === 'recientes') lista = [...lista].sort((a, b) => (b.fechaOrden || 0) - (a.fechaOrden || 0));
    if (orden === 'antiguos') lista = [...lista].sort((a, b) => (a.fechaOrden || 0) - (b.fechaOrden || 0));
    if (orden === 'proximo') lista = [...lista].sort((a, b) => {
      if (!a.proximoContacto) return 1;
      if (!b.proximoContacto) return -1;
      return new Date(a.proximoContacto) - new Date(b.proximoContacto);
    });
    return lista;
  }, [clientes, filtro, busqueda, orden]);

  const conteos = ESTADOS.reduce((acc, e) => {
    acc[e.key] = clientes.filter((c) => !c.archivado && c.estado === e.key).length;
    return acc;
  }, {});

  const vencidos = clientes.filter((c) => !c.archivado && esVencido(c.proximoContacto)).length;

  const terminados = useMemo(() => clientes.filter((c) => c.archivado), [clientes]);
  const totalGanado = useMemo(
    () => terminados.reduce((sum, c) => sum + (parseFloat(c.precio) || 0), 0),
    [terminados]
  );
  const ingresosMensuales = useMemo(
    () => clientes.reduce((sum, c) => sum + (c.mantenimiento ? (parseFloat(c.precioMantenimiento) || 0) : 0), 0),
    [clientes]
  );
  const pendienteDeCobro = useMemo(
    () => terminados.reduce((sum, c) => {
      if (c.estadoPago === 'pagado') return sum;
      const precio = parseFloat(c.precio) || 0;
      return sum + (c.estadoPago === 'señal' ? precio / 2 : precio);
    }, 0),
    [terminados]
  );

  const totalSolicitudes = solicitudes.length;
  const pendientesSolicitudes = solicitudes.filter((r) => (estadoSolicitudes[r.id] || 'pendiente') === 'pendiente').length;
  const hechasSolicitudes = totalSolicitudes - pendientesSolicitudes;

  if (!loaded) {
    return (
      <div className="min-h-screen flex items-center justify-center bg-gradient-to-b from-sky-50 to-white">
        <p className="text-slate-400 text-sm">Cargando tus clientes...</p>
      </div>
    );
  }

  return (
    <div className="min-h-screen bg-gradient-to-b from-sky-50 via-white to-white font-sans">
      <header className="bg-white/80 backdrop-blur border-b border-sky-100 px-6 py-5 flex items-center justify-between gap-4 sticky top-0 z-20">
        <div className="flex items-center gap-2">
          <div className="w-9 h-9 rounded-xl bg-gradient-to-br from-sky-400 to-blue-500 flex items-center justify-center text-white font-bold text-sm">A</div>
          <div>
            <div className="font-bold text-slate-800 leading-none">CLIENTES ATRIO</div>
            <div className="text-slate-400 text-xs">Seguimiento y solicitudes</div>
          </div>
        </div>

        <div className="flex items-center gap-3">
          <div className="hidden sm:flex items-center gap-1.5 bg-emerald-50 border border-emerald-200 text-emerald-700 px-3 py-1.5 rounded-full text-xs font-semibold">
            <Euro size={13} /> {formatearPrecio(totalGanado) || '0 €'} ganados
          </div>
          <div className="relative" ref={menuRef}>
          <button
            onClick={() => setMenuAbierto((v) => !v)}
            className="flex items-center justify-center w-10 h-10 rounded-full border border-slate-200 bg-white text-slate-600 hover:border-sky-300 hover:text-sky-600 transition"
            aria-label="Abrir menú"
          >
            <Menu size={18} />
          </button>

          {menuAbierto && (
            <div className="absolute right-0 mt-2 w-64 bg-white border border-slate-200 rounded-2xl shadow-lg overflow-hidden z-30">
              {MENU_OPCIONES.map((op) => {
                const Icono = op.icon;
                const activo = vista === op.key;
                let badge = null;
                if (op.key === 'sugerencias') {
                  const n = sugerenciasIA.filter((s) => !sugerenciasUsadas.includes(s.id)).length;
                  if (n > 0) badge = n;
                } else if (op.key === 'solicitudes' && pendientesSolicitudes > 0) {
                  badge = pendientesSolicitudes;
                } else if (op.key === 'terminados' && terminados.length > 0) {
                  badge = terminados.length;
                } else if (op.key === 'papelera' && papelera.length > 0) {
                  badge = papelera.length;
                }
                return (
                  <button
                    key={op.key}
                    onClick={() => irA(op.key)}
                    className={`w-full flex items-center justify-between gap-3 px-4 py-3 text-sm text-left transition ${activo ? 'bg-blue-50 text-blue-600 font-semibold' : 'text-slate-600 hover:bg-slate-50'}`}

                    <span className="flex items-center gap-2">
                      <Icono size={16} /> {op.label}

                      </span>

                  </button>
                );

            </div>
          )}
          </div>
        </div>
      </header>
      {autoBuscando && (
        <div className="bg-sky-50 border-b border-sky-100 text-sky-700 text-xs px-6 py-2 flex items-center gap-2">
          <Sparkles size={13} /> Buscando negocios nuevos sin web en tus zonas favoritas de hoy...
        </div>
      )}

      <div className="max-w-5xl mx-auto px-6 py-8">

        {vista === 'solicitudes' ? (

                <table className="w-full text-sm min-w-[900px]">
                  <thead>
                    <tr className="text-left text-xs text-slate-400 border-b border-slate-100">
                      <th className="px-4 py-3 font-medium">Estado</th>
                      <th className="px-4 py-3 font-medium">Fecha</th>

                      <th className="px-4 py-3 font-medium">Negocio</th>
                      <th className="px-4 py-3 font-medium">Contacto</th>
                      <th className="px-4 py-3 font-medium">Tipo</th>
                      <th className="px-4 py-3 font-medium">Plan</th>
                      <th className="px-4 py-3 font-medium">Estilo</th>
                      <th className="px-4 py-3 font-medium">Mensaje</th>
                      <th className="px-4 py-3 font-medium">Referencia</th>
                      <th className="px-4 py-3 font-medium"></th>
                    </tr>
                  </thead>
                  <tbody>
                    {solicitudes.map((r) => {
                      const f = r.fields || {};
                      const yaAgregada = solicitudesAgregadas.includes(r.id);
                      const estado = estadoSolicitudes[r.id] || 'pendiente';
                      return (
                        <tr key={r.id} className="border-b border-slate-50 last:border-0 hover:bg-slate-50/60 align-top">
                          <td className="px-4 py-3">
                            <button
                              onClick={() => marcarEstadoSolicitud(r.id, estado === 'pendiente' ? 'hecho' : 'pendiente')}
                              className={`flex items-center gap-1.5 text-xs font-medium px-2.5 py-1.5 rounded-full border whitespace-nowrap transition ${
                                estado === 'hecho'
                                  ? 'bg-emerald-50 text-emerald-700 border-emerald-300'
                                  : 'bg-amber-50 text-amber-700 border-amber-300'

                            >
                              {estado === 'hecho' ? <Check size={12} /> : <Clock size={12} />}
                              {estado === 'hecho' ? 'Hecho' : 'Pendiente'}
                            </button>
                          </td>
                          <td className="px-4 py-3 text-slate-400 whitespace-nowrap">{formatearFecha(r.createdTime)}</td>
                          <td className="px-4 py-3 text-slate-700 font-medium whitespace-nowrap">{f['Nombre'] || f['Name'] || '—'}</td>

                              {!f['Email'] && !f['Telefono'] && '—'}

                          <td className="px-4 py-3 text-slate-500 whitespace-nowrap">{f['Tipo de negocio'] || '—'}</td>
                          <td className="px-4 py-3 text-slate-500 whitespace-nowrap">{f['Plan'] || '—'}</td>
                          <td className="px-4 py-3 text-slate-500 whitespace-nowrap">{f['Estilo'] || '—'}</td>
                          <td className="px-4 py-3 text-slate-500 max-w-[220px]">
                            <p className="line-clamp-3">{f['Mensaje'] || '—'}</p>

                          <td className="px-4 py-3 text-slate-500">
                            {f['Referencia'] ? (
                              <a

                                yaAgregada

                            </button>
                          </td>
                        </tr>

                  </tbody>
                </table>
              </div>

          </div>
        ) : vista === 'sugerencias' ? (
          <div>

            <div className="flex gap-2 mb-2 flex-wrap">
              <input

                onKeyDown={(e) => { if (e.key === 'Enter') buscarSugerencias(); }}
                placeholder="Zona a buscar (ej: Alcalá de Henares, Chamberí Madrid...)"
                className="flex-1 min-w-[200px] px-4 py-2.5 rounded-full border border-slate-200 bg-white text-sm focus:outline-none focus:border-blue-400"
              />
              <button
                onClick={buscarSugerencias}
                disabled={buscandoSugerencias || !zonaBusqueda.trim()}
                className="flex items-center gap-1.5 bg-blue-500 text-white font-semibold px-4 py-2.5 rounded-full text-sm hover:bg-blue-600 transition disabled:opacity-40 disabled:cursor-not-allowed"
              >
                <Search size={15} /> {buscandoSugerencias ? 'Buscando...' : 'Buscar más'}
              </button>
              <button

                title="Guardar esta zona para que se busque sola cada día"
                className="flex items-center gap-1.5 bg-white border border-slate-200 text-slate-600 font-medium px-4 py-2.5 rounded-full text-sm hover:border-amber-300 hover:text-amber-600 transition disabled:opacity-40 disabled:cursor-not-allowed"
              >
                <Star size={15} /> Actualizar cada día
              </button>
            </div>

            {zonasFavoritas.length > 0 && (
              <div className="flex items-center gap-2 flex-wrap mb-4">
                <span className="text-xs text-slate-400">Zonas que se revisan solas cada día:</span>
                {zonasFavoritas.map((z) => (
                  <span key={z} className="flex items-center gap-1.5 bg-amber-50 border border-amber-200 text-amber-700 text-xs font-medium pl-3 pr-1.5 py-1 rounded-full">
                    <Star size={11} /> {z}
                    <button onClick={() => quitarZonaFavorita(z)} className="hover:text-rose-500 transition p-0.5" title="Dejar de seguir esta zona">
                      <X size={12} />

            )}

            {errorBusqueda && (
              <div className="mb-4 flex items-center gap-2 bg-amber-50 border border-amber-200 text-amber-700 text-sm px-4 py-3 rounded-xl">
                <AlertCircle size={16} /> {errorBusqueda}
              </div>

            <div className="space-y-3 mt-4">
              {sugerenciasIA.filter((s) => !sugerenciasUsadas.includes(s.id)).length === 0 ? (
                <div className="text-center py-16 text-slate-400">
                  <Sparkles className="mx-auto mb-3 opacity-40" size={36} />
                  <p className="text-sm">
                    {sugerenciasIA.length === 0
                      ? 'Escribe una zona arriba y dale a "Buscar más" para encontrar negocios sin web.'
                      : 'Ya añadiste o descartaste todas las sugerencias. ¡Busca otra zona!'}
                  </p>

              ) : (
                sugerenciasIA.filter((s) => !sugerenciasUsadas.includes(s.id)).map((s) => (
                  <div key={s.id} className="bg-white border border-slate-200 rounded-2xl p-4 flex items-center justify-between gap-3 flex-wrap hover:border-sky-200 transition">
                    <div>
                      <div className="flex items-center gap-2 flex-wrap">

                      {s.notas && <p className="text-xs text-slate-400 mt-1">{s.notas}</p>}
                    </div>
                    <div className="flex items-center gap-2">
                      <button
                        onClick={() => descartarSugerencia(s.id)}

                      >
                        <X size={16} />

                      <button

        ) : vista === 'terminados' ? (

            <h1 className="font-bold text-lg text-slate-800 mb-1">Ya hechos</h1>
            <p className="text-sm text-slate-500 mb-4">Negocios a los que ya les hiciste la web. Aquí no aparecen en tu lista de seguimiento.</p>

            <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-6">
              <div className="rounded-2xl border border-emerald-200 bg-emerald-50 p-4">
                <div className="text-xs text-emerald-600 font-medium">Total ganado</div>
                <div className="text-2xl font-bold text-emerald-700">{formatearPrecio(totalGanado) || '0 €'}</div>
                <div className="text-xs text-emerald-600 mt-0.5">{terminados.length} {terminados.length === 1 ? 'web hecha' : 'webs hechas'}</div>
              </div>
              <div className="rounded-2xl border border-amber-200 bg-amber-50 p-4">
                <div className="text-xs text-amber-600 font-medium">Pendiente de cobro</div>
                <div className="text-2xl font-bold text-amber-700">{formatearPrecio(pendienteDeCobro) || '0 €'}</div>

                <div className="text-xs text-sky-600 font-medium">Ingresos recurrentes</div>
                <div className="text-2xl font-bold text-sky-700">{formatearPrecio(ingresosMensuales) || '0 €'}<span className="text-sm font-medium">/mes</span></div>

                  value={nuevo.origen}
                  onChange={(e) => setNuevo({ ...nuevo, origen: e.target.value })}
                  className="w-full mt-1 px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-blue-400"
                >
                  <option value="">Selecciona un origen</option>
                  {ORIGENES.map((o) => (
                    <option key={o} value={o}>{o}</option>
                  ))}
                </select>
              </div>
              <div>
                <label className="text-xs font-semibold text-slate-500">Etiquetas (opcional)</label>
                <input
                  value={nuevo.etiquetas}
                  onChange={(e) => setNuevo({ ...nuevo, etiquetas: e.target.value })}
                  placeholder="Separadas por coma, ej: urgente, panadería"
                  className="w-full mt-1 px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-blue-400"
                />
              </div>
              <label className="flex items-center gap-2 text-xs font-semibold text-slate-500">
                <input
                  type="checkbox"
                  checked={nuevo.mantenimiento}
                  onChange={(e) => setNuevo({ ...nuevo, mantenimiento: e.target.checked })}
                />
                <RefreshCw size={13} /> Incluye mantenimiento mensual
              </label>
              {nuevo.mantenimiento && (
                <div>
                  <label className="text-xs font-semibold text-slate-500">Precio del mantenimiento (€/mes)</label>
                  <input
                    type="number"
                    value={nuevo.precioMantenimiento}
                    onChange={(e) => setNuevo({ ...nuevo, precioMantenimiento: e.target.value })}
                    placeholder="Ej: 15"
                    className="w-full mt-1 px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-blue-400"
                  />
                </div>
              )}
            </div>

            <button
              onClick={agregarCliente}
              disabled={!nuevo.negocio.trim()}
              className="w-full mt-5 bg-blue-500 text-white font-semibold py-2.5 rounded-xl text-sm hover:bg-blue-600 transition disabled:opacity-40 disabled:cursor-not-allowed"
            >
              Añadir a la lista
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<RastreadorClientes />);
</script>
</body>
</html>
